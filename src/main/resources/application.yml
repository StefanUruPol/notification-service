spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifications}
    username: ${DB_USER:notifications}
    password: ${DB_PASSWORD:notifications}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

notifications:
  security:
    api-key: ${API_KEY:local-dev-api-key-change-me}
  dispatch:
    poll-interval-ms: ${DISPATCH_POLL_INTERVAL_MS:2000}
    batch-size: ${DISPATCH_BATCH_SIZE:20}

logging:
  level:
    root: INFO
    com.sagant.notifications: DEBUG
